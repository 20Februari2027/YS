<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Hitster scanner</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#1B1033;color:#fff;text-align:center}
[hidden]{display:none!important}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
h1{margin:0;font-size:2rem;color:#F5A623}
p,li{font-size:1.05rem;line-height:1.5}
ol{text-align:left;max-width:26rem}
a{color:#F5A623}
button{font:inherit;cursor:pointer}
.btn{background:#E63E6D;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:1.1rem}
.ghost{background:none;border:1px solid #fff;color:#fff;border-radius:8px;padding:10px 16px;font-size:1rem}

#under{position:fixed;left:0;bottom:0;width:100%;height:240px;overflow:hidden}
#cover{position:fixed;inset:0;z-index:5;background:#1B1033;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
#play{width:min(60vw,260px);height:min(60vw,260px);border-radius:50%;border:0;background:#E63E6D;color:#fff;font-size:min(24vw,100px);box-shadow:0 0 0 10px rgba(245,166,35,.35)}
#play:disabled{opacity:.5}
#hint{min-height:3em;max-width:24rem;color:#F5A623}

#scanner{position:fixed;inset:0;z-index:6;background:#1B1033;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
#viewfinder{position:relative;width:min(92vw,560px)}
#video{width:100%;border-radius:14px;border:4px solid #F5A623;background:#000;display:block}
#scanmsg{min-height:3em;max-width:30rem;color:#F5A623}
</style></head><body>
<div id="under"><div id="sp"></div><div id="yt"></div></div>
<div id="cover" hidden>
<button id="play" disabled aria-label="Afspelen">&#9654;</button>
<div id="hint">Laden...</div>
<button id="alt" class="ghost" hidden>Werkt het niet? Probeer YouTube</button>
<button id="next" class="ghost">&#128247; Scan volgende</button>
</div>
<div id="scanner">
<h1>&#127926; Scan een kaartje</h1>
<button id="startcam" class="btn">Start camera</button>
<div id="viewfinder" hidden><video id="video" playsinline muted></video></div>
<div id="scanmsg">Geef toegang tot de camera als de browser dat vraagt.</div>
<a href="../">Terug</a>
</div>
<script src="../assets/jsQR.js"></script>
<script src="../assets/speler.js"></script>
<script src="../assets/scan.js"></script>
</body></html>
